<!--
  Reference map of every Webflow page that embeds a full static page from this
  repo via a single Code Embed iframe. Paste the matching snippet below into
  that page's Code Embed exactly as-is. Keep this file in sync whenever a
  page's iframe target changes, so a src never gets pasted onto the wrong page again.
-->

<!-- Webflow page: Home -->
<iframe src="https://dailyadventurebox-owner.github.io/Main-Website/index.html" style="width:100%;min-height:100vh;border:none;" title="Daily Adventure Box — Home"></iframe>

<!--
  2026-08-01: the Federal Terms, General Terms, and Privacy Policy iframes below were
  updated to auto-resize to their content's real height via postMessage (the matching
  script was added to the bottom of each source .html file in this repo). Without this,
  the iframe was pinned to a fixed one-viewport-tall box and the long legal doc scrolled
  in a cramped nested scrollbar inside it — this is what made the page feel "slim" and
  slow to scroll on phones. Each snippet below is now iframe + listener script together;
  paste the whole block into that page's Code Embed, replacing what's there now.
-->

<!-- Webflow page: Federal - Terms and Conditions -->
<iframe id="dab-frame-federal-terms" src="https://dailyadventurebox-owner.github.io/Main-Website/federal-terms-and-conditions.html" style="width:100%;height:100vh;border:none;display:block;" title="Federal Terms and Conditions"></iframe>
<script>
window.addEventListener('message',function(e){
  if(e && e.data && typeof e.data.dabIframeHeight==='number'){
    var f=document.getElementById('dab-frame-federal-terms');
    if(f) f.style.height=e.data.dabIframeHeight+'px';
  }
});
</script>
