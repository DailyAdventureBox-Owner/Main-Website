function createPin(status){
  const c=status==='purchased'?'#5BBDD4':'#74B93F';
  return L.divIcon({
    html:'<svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg"><path d="M14 0C6.268 0 0 6.268 0 14c0 10.5 14 22 14 22S28 24.5 28 14C28 6.268 21.732 0 14 0z" fill="'+c+'" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.35))"/><circle cx="14" cy="14" r="6" fill="white" opacity="0.9"/></svg>',
    className:'',iconAnchor:[14,36],popupAnchor:[0,-36]
  });
}
function initMap(){
  if(map)return;
  map=L.map('map',{center:[32.5,-82],zoom:6});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; OpenStreetMap contributors',maxZoom:19
  }).addTo(map);
  locations.forEach(loc=>{
    const boxes=locationBoxes[loc.id]||[];
    const m=L.marker([loc.lat,loc.lng],{icon:createPin('available')}).addTo(map);
    m.on('click',()=>openLocModal(loc));
    m.bindTooltip('<strong style="font-family:Montserrat,sans-serif;font-size:12px;">'+loc.id+' — '+loc.name+'</strong><br><span style="font-size:11px;color:#666;">'+loc.city+', '+loc.state+' · '+boxes.length+' boxes</span>',{direction:'top',offset:[0,-36]});
    markers[loc.id]=m;
  });
}
   SEARCH + FILTER
function filterBySearch(q){ searchQuery=q.toLowerCase().trim(); filterLocations(currentFilter); }
function filterLocations(filter){
  currentFilter=filter;
  ['ftAll','ftAvail','ftOwned'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(filter==='all'?'ftAll':filter==='available'?'ftAvail':'ftOwned').classList.add('active');
  locations.forEach(loc=>{
    const m=markers[loc.id]; if(!m||!map)return;
    const boxes=locationBoxes[loc.id]||[];
    const ownedHere=boxes.filter(b=>ownedBoxIds.includes(b.id)).length;
    const hasOwned=ownedHere>0, hasAvail=ownedHere<boxes.length;
    const matchF=filter==='all'||(filter==='available'&&hasAvail)||(filter==='purchased'&&hasOwned);
    const q=searchQuery;
    const matchS=!q||loc.name.toLowerCase().includes(q)||loc.id.toLowerCase().includes(q)||loc.city.toLowerCase().includes(q)||loc.state.toLowerCase().includes(q)||loc.address.toLowerCase().includes(q);
    if(matchF&&matchS){map.addLayer(m);m.setIcon(createPin(hasOwned?'purchased':'available'));}
    else map.removeLayer(m);
  });
  renderLocationList();
}
   LOCATION LIST
function renderLocationList(){
  const el=document.getElementById('locationList');
  const q=searchQuery;
  let list=locations.filter(loc=>{
    const boxes=locationBoxes[loc.id]||[];
    const ownedHere=boxes.filter(b=>ownedBoxIds.includes(b.id)).length;
    const hasOwned=ownedHere>0, hasAvail=ownedHere<boxes.length;
    const matchF=currentFilter==='all'||(currentFilter==='available'&&hasAvail)||(currentFilter==='purchased'&&hasOwned);
    const matchS=!q||loc.name.toLowerCase().includes(q)||loc.id.toLowerCase().includes(q)||loc.city.toLowerCase().includes(q)||loc.state.toLowerCase().includes(q)||loc.address.toLowerCase().includes(q);
    return matchF&&matchS;
  });
  if(!list.length){el.innerHTML='<div style="text-align:center;padding:30px 16px;color:#bbb;font-size:13px;font-family:Montserrat,sans-serif;font-weight:600;">No locations found</div>';return;}
  el.innerHTML=list.map(loc=>{
    const boxes=locationBoxes[loc.id]||[];
    const ownedHere=boxes.filter(b=>ownedBoxIds.includes(b.id)).length;
    const hasOwned=ownedHere>0;

  const progress=profit>0?Math.min(Math.round((monthly/profit)*100*3),100):0;

  document.getElementById('statOwned').textContent=ownedBoxIds.length;
  document.getElementById('statInvested').textContent='$'+total.toLocaleString();

async function loadDABEvents(){

  const gb=document.getElementById('gcalBtn');
  gb.textContent='Loading events...';
  gcalConnected=true;
  await fetchCalendarEvents();

async function fetchCalendarEvents(){
  if(typeof supa==='undefined')return;
  const y=calendarDate.getFullYear(),m=calendarDate.getMonth();
  const start=new Date(y,m,1).toISOString().split('T')[0];
  const end=new Date(y,m+1,0).toISOString().split('T')[0];
  try{
    const{data,error}=await supa.from('calendar_events').select('*').gte('event_date',start).lte('event_date',end).order('start_time',{ascending:true});
    if(error)throw error;
    gcalEvents={};
    if(data){
      data.forEach(ev=>{
        const d=new Date(ev.event_date+'T00:00:00');
        const key=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
        if(!gcalEvents[key])gcalEvents[key]=[];
        const title=ev.title||'DAB Event';
        let time='All day';
        if(!ev.all_day&&ev.start_time){
          const [h,mi]=ev.start_time.split(':');
          const hr=parseInt(h);
          time=((hr%12)||12)+':'+mi+(hr>=12?' PM':' AM');
        }
        gcalEvents[key].push({title:title,time:time,color:ev.color||'#74B93F',link:ev.meeting_link||''});
      });
    }
  }catch(e){console.warn('Calendar fetch error:',e);}
}
function renderCalendar(){
  const y=calendarDate.getFullYear(),m=calendarDate.getMonth();
  const mName=calendarDate.toLocaleString('en-US',{month:'long'});
  document.getElementById('calMonthLabel').textContent=mName.toUpperCase()+' '+y;
  const firstDow=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const today=new Date();
  let h='';
  ['SUN','MON','TUE','WED','THU','FRI','SAT'].forEach(d=>{h+='<div class="cal-dow">'+d+'</div>';});
  for(let i=0;i<firstDow;i++)h+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const isToday=d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();
    const key=y+'-'+m+'-'+d;
    const evts=(gcalConnected&&gcalEvents[key])||[];
    const evH=evts.map(e=>'<span class="cal-event-pill" style="background:'+e.color+'22;color:'+e.color+';">'+e.title+'</span>').join('');
    h+='<div class="cal-cell '+(isToday?'today':'')+'"><div class="cal-cell-num">'+d+'</div>'+evH+'</div>';
  }
  document.getElementById('calGrid').innerHTML=h;
  const gb=document.getElementById('gcalBtn');
  if(gcalConnected){gb.textContent='✓ DAB Events Loaded';gb.classList.add('connected');}
  else{gb.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Load DAB Events';gb.classList.remove('connected');}
}

  }

   SUPPORT MODAL
function openSupportModal(){
  document.getElementById('supportName').value=currentUser?currentUser.name:'';
  document.getElementById('supportEmail').value=currentUser?currentUser.email:'';
  document.getElementById('supportMessage').value='';
  document.getElementById('supportSubject').selectedIndex=0;
  const m=document.getElementById('supportModal');m.style.display='flex';setTimeout(()=>m.classList.add('open'),10);
}
function closeSupportModal(){const m=document.getElementById('supportModal');m.classList.remove('open');m.style.display='none';}
function submitSupport(){
  const msg=document.getElementById('supportMessage').value.trim();
  if(!msg){alert('Please describe your issue or question.');return;}
  const name=document.getElementById('supportName').value;
  const email=document.getElementById('supportEmail').value;
  const subject=document.getElementById('supportSubject').value;
  const body=encodeURIComponent('Name: '+name+'\nEmail: '+email+'\nSubject: '+subject+'\n\n'+msg);
  window.open('mailto:support@dailyadventurebox.com?subject='+encodeURIComponent('[Fund Adventure] '+subject)+' &body='+body);
  closeSupportModal();
  addNotification('Support Request Sent','Your message has been sent to DAB support. We\'ll respond within 24 hours.','📩');
}
document.getElementById('supportModal').addEventListener('click',e=>{if(e.target===document.getElementById('supportModal'))closeSupportModal();});
   NOTIFICATIONS
let notifications=[];
function addNotification(title,body,icon){
  notifications.unshift({title,body,icon:icon||'📌',time:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})});
  const b=document.getElementById('notifBadge');
  b.style.display='flex';b.textContent=notifications.length>9?'9+':notifications.length;
}
function toggleNotifications(){
  const p=document.getElementById('notifPanel');
  const isOpen=p.style.display==='block';
  p.style.display=isOpen?'none':'block';
  if(!isOpen)renderNotifications();
}
function renderNotifications(){
  const el=document.getElementById('notifList');
  if(!notifications.length){el.innerHTML='<div style="text-align:center;padding:24px;color:#bbb;font-size:13px;">No notifications yet</div>';return;}
  el.innerHTML=notifications.map(n=>'<div style="display:flex;gap:10px;padding:10px;border-radius:8px;margin-bottom:4px;transition:background 0.15s;cursor:default;" onmouseover="this.style.background=\'#f9f7f3\'" onmouseout="this.style.background=\'transparent\'"><div style="font-size:18px;flex-shrink:0;">'+n.icon+'</div><div style="flex:1;min-width:0;"><div style="font-family:Montserrat,sans-serif;font-weight:700;font-size:12px;color:var(--coal);">'+n.title+'</div><div style="font-size:11px;color:#999;line-height:1.5;margin-top:2px;">'+n.body+'</div><div style="font-size:9px;color:#ccc;margin-top:3px;">'+n.time+'</div></div></div>').join('');
}
function clearNotifications(){
  notifications=[];
  document.getElementById('notifBadge').style.display='none';
  renderNotifications();
}
